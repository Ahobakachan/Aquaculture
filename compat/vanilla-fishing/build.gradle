plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.111'
}
group = 'local.aquavanilla'
version = '1.0.0'
base.archivesName = 'Aquaculture-Vanilla-Fishing-1.21.1-NeoForge'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.terraformersmc.com' }
}
dependencies {
    implementation 'maven.modrinth:aquaculture:2.7.21'
    implementation 'maven.modrinth:lavafishing:1.21.1-1.2.13'
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.25.1.332'
    compileOnly 'dev.emi:emi-neoforge:1.1.22+1.21.1:api'
}
neoForge {
    version = '21.1.218'
    mods { aquavanilla { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar) { manifest.attributes('MixinConfigs': 'aquavanilla.mixins.json') }
